server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are capped at 500 MB by the API (LEARNLOOP_MAX_UPLOAD_BYTES); let the API enforce it.
    client_max_body_size 600m;

    location /api/ {
        proxy_pass http://api:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream uploads straight through, and allow slow analysis requests.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/lab, /procedures/...) fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
